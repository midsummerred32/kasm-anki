name: Build and push Anki Kasm image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "versions.env"
      - "anki.desktop"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned versions
        id: versions
        run: |
          source versions.env
          echo "anki=$ANKI_VERSION" >> "$GITHUB_OUTPUT"
          echo "kasm=$KASM_BASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ANKI_VERSION=${{ steps.versions.outputs.anki }}
            KASM_BASE_TAG=${{ steps.versions.outputs.kasm }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:anki-${{ steps.versions.outputs.anki }}
          cache-from: type=gha
          cache-to: type=gha,mode=max